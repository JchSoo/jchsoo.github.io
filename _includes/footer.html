<footer class="site-footer shell">
  <div class="footer-top">
    <a class="footer-brand" href="{{ '/' | relative_url }}">{{ site.title | escape }}</a>
    <div class="footer-links">
      {% unless site.github_username == 'YOUR_USERNAME' %}<a href="https://github.com/{{ site.github_username | escape }}" rel="noopener noreferrer" target="_blank">GitHub</a>{% endunless %}
      <a href="#top">맨 위로 ↑</a>
    </div>
  </div>
  <p class="footer-bottom">© {{ 'now' | date: '%Y' }} {{ site.author | escape }}</p>
</footer>
