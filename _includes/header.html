<header class="site-header" id="top">
  <div class="shell header-inner">
    <a class="brand" href="{{ '/' | relative_url }}" aria-label="{{ site.author | escape }} 홈">
      <svg class="brand-mark" aria-hidden="true" viewBox="0 0 32 32" fill="none"><path d="M16 3c-2.5 5-9 11-9 17a9 9 0 0 0 18 0c0-6-6.5-12-9-17Z"/><path d="M11 20a5 5 0 0 0 5 5"/></svg>
      <span class="brand-type">{{ site.author | escape }}</span>
    </a>

    <nav class="desktop-nav" aria-label="Main navigation" lang="en">
      <a href="{{ '/archive/' | relative_url }}" {% if page.url == '/archive/' %}aria-current="page"{% endif %}>Archive</a>
      <a href="{{ '/#recent-posts' | relative_url }}">Recent Posts</a>
      <a href="{{ '/about/' | relative_url }}" {% if page.url == '/about/' %}aria-current="page"{% endif %}>About</a>
    </nav>

    <div class="header-actions" lang="en">
      <button type="button" class="icon-button search-toggle" aria-label="Open search" aria-keyshortcuts="Control+k Meta+k /" title="Search (Ctrl/⌘+K)">
        <svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="10.8" cy="10.8" r="6.4"/><path d="m16 16 4.2 4.2"/></svg>
      </button>
      <button type="button" class="icon-button theme-toggle" aria-label="Switch to light mode" title="Switch to light mode">
        <svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.93 4.93l1.41 1.41m11.32 11.32 1.41 1.41M2 12h2m16 0h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
      </button>
      <button type="button" class="icon-button mobile-toggle" aria-label="Open menu" aria-expanded="false" aria-controls="mobile-navigation">
        <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
    </div>
  </div>
  <nav class="mobile-nav" id="mobile-navigation" aria-label="Mobile navigation" lang="en" hidden>
    <a href="{{ '/archive/' | relative_url }}">Archive</a>
    <a href="{{ '/#recent-posts' | relative_url }}">Recent Posts</a>
    <a href="{{ '/about/' | relative_url }}">About</a>
  </nav>
</header>
