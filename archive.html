---
layout: default
title: 글 목록
description: 개발 및 보안 학습 기록 전체 글 목록
permalink: /archive/
---
<section class="shell page-heading">
  <h1>글 목록 <span class="count-text">{{ site.posts.size }}</span></h1>
</section>
<section class="shell inner-section">
  <div class="archive-toolbar">
    <div class="filter-controls" role="group" aria-label="카테고리 필터">
      <button type="button" class="filter-button active" data-category="all" aria-pressed="true">전체</button>
      {% for item in site.data.categories %}<button type="button" class="filter-button" data-category="{{ item.slug }}" aria-pressed="false">{{ item.name }}</button>{% endfor %}
    </div>
  </div>
  <div class="post-list" id="archive-results">
    {% for post in site.posts %}<div class="archive-item" data-category="{{ post.categories | first }}">{% include post-card.html post=post %}</div>{% endfor %}
  </div>
  <p class="empty-state archive-empty" hidden>이 카테고리에는 아직 글이 없습니다.</p>
</section>
