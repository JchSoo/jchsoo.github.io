<!DOCTYPE html>
<html lang="{{ site.lang | default: 'ko-KR' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1117">
  <meta name="color-scheme" content="dark light">
  <title>{% if page.title %}{{ page.title | escape }} | {% endif %}{{ site.title | escape }}</title>
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <link rel="icon" type="image/svg+xml" href="{{ '/assets/images/favicon.svg' | relative_url }}">
  <link rel="alternate" type="application/rss+xml" title="{{ site.title | escape }}" href="{{ '/feed.xml' | absolute_url }}">
  <meta property="og:type" content="{% if page.layout == 'post' %}article{% else %}website{% endif %}">
  <meta property="og:title" content="{{ page.title | default: site.title | escape }}">
  <meta property="og:description" content="{{ page.description | default: site.description | escape }}">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <meta property="og:site_name" content="{{ site.title | escape }}">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  <script>try{document.documentElement.dataset.theme=localStorage.getItem('trace-theme')||'dark'}catch(e){document.documentElement.dataset.theme='dark'}</script>
</head>
<body>
  <a class="skip-link" href="#main-content">본문으로 건너뛰기</a>
  {% include header.html %}
  <main id="main-content">{{ content }}</main>
  {% include footer.html %}
  <dialog class="search-dialog" id="search-dialog" aria-labelledby="search-heading">
    <div class="search-dialog-head"><span id="search-heading">⌕ &nbsp; SEARCH THE LOG</span><button class="close-search" type="button" aria-label="검색 닫기">ESC ×</button></div>
    <label class="sr-only" for="site-search-input">글 검색</label>
    <input type="search" id="site-search-input" placeholder="제목, 키워드, 태그로 검색..." autocomplete="off">
    <p class="search-hint">검색어를 입력하면 관련 글을 보여줍니다.</p>
    <div class="search-results" id="site-search-results" aria-live="polite"></div>
  </dialog>
  <script>window.TRACE_BASEURL={{ site.baseurl | jsonify }};</script>
  <script src="{{ '/assets/js/main.js' | relative_url }}" defer></script>
</body>
</html>
