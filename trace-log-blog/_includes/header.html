<header class="site-header" id="top">
  <div class="shell header-inner">
    <a class="brand" href="{{ '/' | relative_url }}" aria-label="{{ site.title }} 홈">
      <span class="brand-mark" aria-hidden="true"><span>_</span></span>
      <span class="brand-type">{% assign brand_parts = site.title | split: '.' %}{% for part in brand_parts %}{% unless forloop.first %}<span class="brand-dot">.</span>{% endunless %}{{ part | escape }}{% endfor %}</span>
    </a>

    <nav class="desktop-nav" aria-label="주요 메뉴">
      <a href="{{ '/' | relative_url }}" {% if page.url == '/' %}aria-current="page"{% endif %}>Home</a>
      <a href="{{ '/archive/' | relative_url }}" {% if page.url == '/archive/' %}aria-current="page"{% endif %}>Archive</a>
      <a href="{{ '/#categories' | relative_url }}">Categories</a>
      <a href="{{ '/about/' | relative_url }}" {% if page.url == '/about/' %}aria-current="page"{% endif %}>About</a>
    </nav>

    <div class="header-actions">
      <button type="button" class="icon-button search-toggle" aria-label="검색 열기" aria-keyshortcuts="Control+k Meta+k /" title="검색 (Ctrl/⌘+K)">
        <svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="10.8" cy="10.8" r="6.4"/><path d="m16 16 4.2 4.2"/></svg>
      </button>
      <button type="button" class="icon-button theme-toggle" aria-label="라이트 테마 켜기" title="테마 전환">
        <svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.93 4.93l1.41 1.41m11.32 11.32 1.41 1.41M2 12h2m16 0h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
      </button>
      <button type="button" class="icon-button mobile-toggle" aria-label="모바일 메뉴 열기" aria-expanded="false" aria-controls="mobile-navigation">
        <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
    </div>
  </div>
  <nav class="mobile-nav" id="mobile-navigation" aria-label="모바일 메뉴" hidden>
    <a href="{{ '/' | relative_url }}">Home</a>
    <a href="{{ '/archive/' | relative_url }}">Archive</a>
    <a href="{{ '/#categories' | relative_url }}">Categories</a>
    <a href="{{ '/about/' | relative_url }}">About</a>
  </nav>
</header>
